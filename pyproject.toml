[project]
name = "reducio"
version = "1.0.0"
description = "Semantic code compression engine"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Alex Karsten" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
]

[project.optional-dependencies]
llm = ["httpx>=0.28,<1"]
reports = ["plotly>=6,<8"]
embeddings = [
    "chromadb>=1.5.0",
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "coverage[toml]>=7.10.6",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
reducio = "reducio.cli:app"

[project.urls]
Repository = "https://github.com/mementomorri/reducio"
Documentation = "https://github.com/mementomorri/reducio/blob/main/docs/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reducio"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "F841", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
"reducio/metrics.py" = ["N802", "N815"] # ast.NodeVisitor dispatch requires visit_NodeName

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=reducio --cov-report=term-missing --cov-fail-under=60"
markers = [
    "embeddings: requires sentence-transformers model download",
]

[tool.coverage.run]
patch = ["subprocess"]
