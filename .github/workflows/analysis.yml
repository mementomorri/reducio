name: Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install
        run: pip install -e ".[embeddings]"

      - name: Analyze package (dogfood)
        run: |
          OUT=$(reducto analyze reducto/ --report -v)
          echo "$OUT"
          echo "$OUT" | grep -qv "Symbols: 0" || { echo "PARSE REGRESSION: zero symbols"; exit 1; }
          test -n "$(ls -1 .reducto/reducto-baseline-*.md 2>/dev/null | head -1)"

      - name: Analyze fixture corpus
        run: |
          OUT=$(reducto analyze test-python-code/python --report -v)
          echo "$OUT"
          echo "$OUT" | grep -qv "Symbols: 0" || { echo "PARSE REGRESSION: zero symbols"; exit 1; }
          echo "$OUT" | grep -Eq "Hotspots: [1-9]" || { echo "no hotspots detected"; exit 1; }
          test -n "$(ls -1 .reducto/reducto-baseline-*.md 2>/dev/null | head -1)"

      - name: Quality check
        run: |
          reducto check test-python-code/python --report
          test -n "$(ls -1 .reducto/reducto-check-*.md 2>/dev/null | head -1)"

      - name: Stage reports for upload
        run: |
          mkdir -p ci-reports
          cp -v .reducto/reducto-baseline-*.md ci-reports/
          cp -v .reducto/reducto-check-*.md ci-reports/
          ls -la ci-reports/

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: reducto-analysis-reports
          path: ci-reports/
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          REPORT=$(ls -t .reducto/reducto-baseline-*.md 2>/dev/null | head -1)
          {
            echo "## reducto analysis"
            echo "Latest report: \`$REPORT\`"
            echo ""
            head -80 "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
