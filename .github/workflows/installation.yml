name: Installation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e ".[embeddings]"
      - run: reducio version
      - run: python -c "import reducio; print(reducio.__version__)"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install build && python -m build
      - run: pip install dist/*.whl && reducio --help
      - name: Base installation needs no HTTP client
        run: python -I -c "import reducio.cli, importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('httpx', 'tree_sitter', 'chromadb', 'numpy'))"
      - run: pip install 'reducio[llm]'
      - name: Optional API contracts (no live API calls)
        run: python -I scripts/smoke_llm.py
