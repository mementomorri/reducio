name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install
        run: pip install -e ".[dev,embeddings,reports,llm]"

      - name: Tests
        run: pytest tests/ -v

      - name: Assert fixture corpus unmodified
        if: always()
        run: git diff --exit-code test-python-code/

      - name: CLI smoke
        run: reducio --help && reducio version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e ".[dev]"
      - run: ruff check reducio/ tests/ scripts/
      - run: black --check reducio/ tests/ scripts/
      - run: mypy reducio/ --ignore-missing-imports

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install build && python -m build
      - name: Verify built wheel before publication (no model downloads)
        run: python -m scripts.smoke_pypi --local --wheel-directory dist --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          overwrite: true
          if-no-files-found: error
